<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MarketPulse</title>
  <link rel="stylesheet" href="./frontend/css/styles.css">
</head>

<section id="hero">
  <div class="hero-container">

    <div class="hero-left">
      <h1>MarketPulse</h1>
      <p>Seguiment de mercats en temps real</p>

      <select id="market-select">
        <option value="spain">España (IBEX35)</option>
        <option value="usa">USA (NASDAQ + S&P500)</option>
        <option value="crypto">Crypto</option>
        <option value="europe">Europa</option>
        <option value="forex">Forex</option>
      </select>
    </div>

    <div class="hero-right">
      <div id="carousel-container">
        <!-- Carroussel dinàmic -->
      </div>
    </div>

  </div>
</section>

<body>

<div class="layout">

  <!-- LEFT: Yahoo-style market list -->
  <div class="sidebar">
    <h3>Mercats</h3>
    <div id="marketList"></div>
  </div>

  <!-- CENTER: Binance-style main panel -->
  <div class="main">

    <div class="header">
      <h2 id="symbol">--</h2>
      <div id="price">--</div>
      <div id="change">--</div>
    </div>

    <div class="chart">
      <p>📈 Chart placeholder (later Chart.js)</p>
    </div>

  </div>

  <!-- RIGHT: alerts / watchlist -->
  <div class="rightbar">
    <h3>Preferits</h3>
    <div id="watchlist"></div>

    <h3>Alertes</h3>
    <div id="alerts"></div>
  </div>

</div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
