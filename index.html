<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>MarketPulse</title>
  <link rel="stylesheet" href="./frontend/css/styles.css">
</head>

<body>

  <header id="header">

    <div class="header-top">
      <div class="header-left">
        <h1>MarketPulse</h1>
        <p>Seguiment de mercats en temps real</p>
      </div>

      <div class="header-right">
        <select id="market-select">
          <option value="ibex35">España</option>
          <option value="usa">USA</option>
          <option value="europe">Europa</option>
          <option value="asia">Asia</option>
        </select>
      </div>
    </div>

    <div class="header-ticker">
      <div id="ticker-container">
      </div>
    </div>

  </header>


  <!-- LAYOUT PRINCIPAL -->
  <main class="layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div id="marketList"></div>
      <h3>Tendències</h3>
      <div id="trending"></div>

      <h3>Volums més alts</h3>
      <div id="highVolume"></div>

      <h3>Gainers / Losers</h3>
      <div id="gainersLosers"></div>
    </aside>

    <!-- CONTINGUT CENTRAL -->
    <section class="main">

      </div>

      <div class="header">
        <div class="chart-component">
          <h2 id="chart-title">Gràfica del mercat</h2>
          <canvas id="marketChart"></canvas>
        </div>

      </div>

      <div id="chart-container"></div>
    </section>

    <!-- RIGHT SIDEBAR -->

    <aside class="rightbar">
      <div id="sidebar-right">
        <div id="quote-box">
          <h2 id="symbol">Ticker</h2>
          <p id="price">Preu</p>
          <p id="change">Change</p>
        </div>
    </aside>

  </main>


  <!-- JS MODULES -->
  <script type="module" src="/frontend/js/state.js"></script>
  <script type="module" src="/frontend/js/api.js"></script>
  <script type="module" src="/frontend/js/ui.js"></script>
  <script type="module" src="/frontend/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="/frontend/js/chart.js"></script>

</body>

</html>
